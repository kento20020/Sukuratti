<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>バナナスクラッチチャンス</title>
  <meta name="description" content="こすってバナナを当てよう！ 13種類のバナナと6種類のスクラッチが楽しめる、ブラウザだけで遊べるスクラッチくじ。">
  <meta name="theme-color" content="#ff0033">
  <meta property="og:title" content="バナナスクラッチチャンス">
  <meta property="og:description" content="こすってバナナを当てよう！ 13種類のバナナと6種類のスクラッチ。">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar">
      <button class="icon-btn back-btn" id="backBtn" type="button" aria-label="もどる" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="brand" href="#/" id="brand">
        <img src="assets/icon.svg" alt="" width="28" height="28">
        <span class="brand-text">バナナ<strong>スクラッチ</strong></span>
      </a>
      <h1 class="topbar-title" id="topbarTitle" hidden></h1>
      <div class="topbar-right">
        <button class="points-pill" id="pointsPill" type="button" aria-label="保有ポイント">
          <span class="coin" aria-hidden="true">P</span>
          <span id="pointsValue">0</span><small>pt</small>
        </button>
        <button class="icon-btn" id="soundBtn" type="button" aria-label="サウンド" aria-pressed="true">
          <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="メニュー">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" fill="currentColor"/></svg>
        <span>ホーム</span>
      </a>
      <a href="#/zukan" data-tab="zukan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11a3 3 0 013 3v15H7a2 2 0 01-2-2zM7 17h10M9 7h6M9 11h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span>図鑑</span>
      </a>
      <a href="#/card/trial" data-tab="card" class="tab-center" aria-label="おためしで削る">
        <span class="tab-center-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c3-1 5-4 7-7s4-6 9-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M5 12c2-1 3-3 4-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="18" cy="17" r="2.4" fill="currentColor"/></svg>
        </span>
        <span>削る</span>
      </a>
      <a href="#/history" data-tab="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>履歴</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7 7 0 01-2 1.2L14.8 21h-4l-.3-2.4a7 7 0 01-2-1.2l-1.9.7-2-3.4 1.6-1.2a7 7 0 010-2.4L4.6 9.9l2-3.4 1.9.7a7 7 0 012-1.2L10.8 3h4l.3 2.4a7 7 0 012 1.2l1.9-.7 2 3.4-1.6 1.2a7 7 0 010 2.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>設定</span>
      </a>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="assertive"></div>

  <noscript>
    <p style="padding:24px;text-align:center">このサイトで遊ぶには JavaScript を有効にしてください。</p>
  </noscript>

  <script src="assets/js/bananas.js"></script>
  <script src="assets/js/cards.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/sound.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/scratch.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
